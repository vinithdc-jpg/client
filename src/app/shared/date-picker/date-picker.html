<div class="relative w-full">
  <button
    [id]="inputId"
    type="button"
    class="flex min-h-[42px] w-full items-center justify-between gap-3 rounded-lg border border-slate-200 bg-white px-3 py-2.5 text-left text-sm text-slate-700 shadow-sm transition hover:border-indigo-400 focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-100 disabled:cursor-not-allowed disabled:bg-slate-100 disabled:text-slate-400"
    [disabled]="isDisabled"
    [attr.aria-expanded]="isOpen"
    aria-haspopup="dialog"
    (click)="toggleCalendar()"
  >
    <span [class.text-slate-400]="!selectedLabel">
      {{ selectedLabel || placeholder }}
    </span>
    <svg
      class="h-5 w-5 shrink-0 text-indigo-600"
      fill="none"
      stroke="currentColor"
      viewBox="0 0 24 24"
      aria-hidden="true"
    >
      <path
        stroke-linecap="round"
        stroke-linejoin="round"
        stroke-width="1.8"
        d="M8 2v4m8-4v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"
      />
    </svg>
  </button>

  @if (isOpen) {
    <section
      class="absolute left-0 top-full z-50 mt-2 w-[min(20rem,calc(100vw-2rem))] rounded-2xl border border-slate-200 bg-white p-4 shadow-xl"
      role="dialog"
      aria-label="Choose a date"
    >
      <header class="mb-4 flex items-center justify-between">
        <button
          type="button"
          class="grid h-9 w-9 place-items-center rounded-lg text-slate-600 transition hover:bg-indigo-50 hover:text-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-200"
          aria-label="Previous month"
          (click)="changeMonth(-1)"
        >
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m15 18-6-6 6-6" />
          </svg>
        </button>
        <h2 class="m-0 text-sm font-bold text-slate-800">{{ monthLabel }}</h2>
        <button
          type="button"
          class="grid h-9 w-9 place-items-center rounded-lg text-slate-600 transition hover:bg-indigo-50 hover:text-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-200"
          aria-label="Next month"
          (click)="changeMonth(1)"
        >
          <svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m9 18 6-6-6-6" />
          </svg>
        </button>
      </header>

      <div class="grid grid-cols-7 gap-1 text-center" role="grid">
        @for (weekday of weekdays; track weekday) {
          <span class="py-2 text-xs font-semibold text-slate-400" role="columnheader">
            {{ weekday }}
          </span>
        }
        @for (day of calendarDays; track day.date.getTime()) {
          <button
            type="button"
            class="relative grid aspect-square place-items-center rounded-lg text-sm transition focus:outline-none focus:ring-2 focus:ring-indigo-300"
            [class.text-slate-300]="!day.isCurrentMonth && !day.isSelected"
            [class.text-slate-700]="day.isCurrentMonth && !day.isSelected"
            [class.font-semibold]="day.isToday || day.isSelected"
            [class.bg-indigo-600]="day.isSelected"
            [class.text-white]="day.isSelected"
            [class.hover:bg-indigo-50]="!day.isSelected"
            [attr.aria-label]="day.date.toLocaleDateString('en-US', { dateStyle: 'full' })"
            [attr.aria-pressed]="day.isSelected"
            role="gridcell"
            (click)="selectDate(day.date)"
          >
            {{ day.label }}
            @if (day.isToday && !day.isSelected) {
              <span class="absolute bottom-1 h-1 w-1 rounded-full bg-indigo-500"></span>
            }
          </button>
        }
      </div>

      <footer class="mt-3 flex items-center justify-between border-t border-slate-100 pt-3">
        <button
          type="button"
          class="rounded-md px-2 py-1 text-xs font-semibold text-indigo-700 hover:bg-indigo-50"
          (click)="selectToday()"
        >
          Today
        </button>
        @if (hasSelectedValue) {
          <button
            type="button"
            class="rounded-md px-2 py-1 text-xs font-semibold text-slate-500 hover:bg-slate-100"
            (click)="clearDate()"
          >
            Clear date
          </button>
        }
      </footer>
    </section>
  }
</div>
