<section class="page-shell">
  <div class="page-heading">
    <div>
      <h1>Create a project</h1>
      <p>Describe the work and invite freelancers to submit proposals.</p>
    </div>
    <a class="button button-secondary" routerLink="/projects">Cancel</a>
  </div>

  <form class="panel" #projectForm="ngForm" (ngSubmit)="onSubmit()">
    <div class="form-grid">
      <div class="field field-wide">
        <label for="project-title">Project title</label>
        <input
          id="project-title"
          name="title"
          type="text"
          [(ngModel)]="title"
          required
          maxlength="150"
          autocomplete="off"
        />
      </div>

      <div class="field field-wide">
        <label for="project-description">Description</label>
        <textarea
          id="project-description"
          name="description"
          [(ngModel)]="description"
          required
          maxlength="20000"
          rows="7"
        ></textarea>
      </div>

      <div class="field">
        <label for="project-budget">Budget</label>
        <input
          id="project-budget"
          name="budget"
          type="number"
          [(ngModel)]="budget"
          required
          min="0"
          step="0.01"
        />
      </div>

      <div class="field">
        <label for="project-deadline">Deadline (optional)</label>
        <input
          id="project-deadline"
          name="deadline"
          type="date"
          [(ngModel)]="deadline"
        />
      </div>
    </div>

    @if (errorMessage) {
      <p class="notice notice-error" role="alert">{{ errorMessage }}</p>
    }

    <div class="form-actions">
      <button
        class="button button-primary"
        type="submit"
        [disabled]="isLoading || projectForm.invalid"
      >
        {{ isLoading ? 'Creating project...' : 'Create project' }}
      </button>
      <a class="button button-secondary" routerLink="/projects">Cancel</a>
    </div>
  </form>
</section>
