<section
  class="mx-auto my-8 grid w-[min(440px,100%)] gap-4.5 rounded-[14px] border border-[#e2e8f0] bg-white p-8 shadow-[0_5px_18px_rgb(26_48_75/4%)] dark:bg-slate-900 dark:border-slate-700"
  aria-labelledby="register-heading"
>
  <h1 class="m-0 text-[2em] font-bold text-[#172d46] dark:text-slate-100" id="register-heading">
    Create your DevCollab account
  </h1>

  <form class="grid gap-3" #registerForm="ngForm" (ngSubmit)="onSubmit()">
    <label for="name">Full name</label>
    <input id="name" name="name" type="text" [(ngModel)]="name" required maxlength="100" />

    <label for="email">Email</label>
    <input id="email" name="email" type="email" [(ngModel)]="email" required email />

    <label for="password">Password</label>
    <input
      id="password"
      name="password"
      type="password"
      [(ngModel)]="password"
      required
      minlength="8"
      maxlength="72"
    />

    <label for="role">Account type</label>
    <select id="role" name="role" [(ngModel)]="role" required>
      <option value="freelancer">Freelancer</option>
      <option value="client">Client</option>
    </select>

    <button
      class="inline-flex min-h-10 cursor-pointer items-center justify-center gap-1.75 rounded-lg border border-transparent px-3.5 py-2.25 text-[0.9rem] font-[650] transition-colors duration-150 disabled:cursor-not-allowed disabled:opacity-60 bg-[#205b8f] text-white hover:enabled:bg-[#174b79]"
      type="submit"
      [disabled]="isLoading || registerForm.invalid"
    >
      {{ isLoading ? 'Creating account...' : 'Create account' }}
    </button>

    @if (errorMessage) {
      <p
        class="rounded-lg px-3.5 py-3 leading-normal border border-[#f3c5c2] bg-[#fff3f2] text-[#902e29] dark:bg-red-950/40 dark:border-red-800 dark:text-red-300"
        role="alert"
      >
        {{ errorMessage }}
      </p>
    }

    @if (successMessage) {
      <p
        class="rounded-lg px-3.5 py-3 leading-normal border border-[#bfe2ca] bg-[#effaf2] text-[#23643b] dark:bg-emerald-950/40 dark:border-emerald-800 dark:text-emerald-300"
        role="status"
      >
        {{ successMessage }}
      </p>
    }
  </form>

  <p class="m-0 text-[#637286] dark:text-slate-300">
    Already registered? <a routerLink="/login">Sign in</a>
  </p>
</section>
