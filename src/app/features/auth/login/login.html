<section class="auth-card" aria-labelledby="login-heading">
  <h1 id="login-heading">Sign in to DevCollab</h1>

  <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" [(ngModel)]="email" required email />

    <label for="password">Password</label>
    <input id="password" name="password" type="password" [(ngModel)]="password" required />

    <button class="button button-primary" type="submit" [disabled]="isLoading || loginForm.invalid">
      {{ isLoading ? 'Signing in...' : 'Sign in' }}
    </button>

    @if (errorMessage) {
      <p class="notice notice-error" role="alert">{{ errorMessage }}</p>
    }

    @if (successMessage) {
      <p class="notice notice-success" role="status">{{ successMessage }}</p>
    }
  </form>

  <p>New to DevCollab? <a routerLink="/register">Create an account</a></p>
</section>
