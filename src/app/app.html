<header
  class="flex min-h-18 items-center gap-8 border-b border-[#e3e8ef] bg-white px-[5vw] max-[720px]:min-h-0 max-[720px]:flex-wrap max-[720px]:gap-x-5 max-[720px]:gap-y-3 max-[720px]:px-[4vw] max-[720px]:py-3.5 dark:bg-slate-900 dark:border-slate-700"
>
  <a
    class="inline-flex items-center gap-2.5 text-[1.12rem] font-[750] text-[#172d46] dark:text-slate-100"
    routerLink="/projects"
    aria-label="DevCollab home"
  >
    <img class="h-8 w-auto object-contain" src="/image.png" alt="Logo" />
  </a>

  @if (authService.currentUser(); as user) {
    <nav
      class="flex flex-1 items-center gap-2 max-[720px]:order-3 max-[720px]:basis-full max-[720px]:overflow-x-auto"
      aria-label="Main navigation"
    >
      <a
        class="rounded-lg px-3 py-2.25 text-[0.92rem] font-semibold text-[#526174] dark:text-slate-300"
        routerLink="/projects"
        routerLinkActive="bg-[#f0f5fa] text-[#1d527f] dark:bg-slate-800 dark:!text-blue-300"
        >Projects</a
      >
      @if (user.role === 'client') {
        <a
          class="rounded-lg px-3 py-2.25 text-[0.92rem] font-semibold text-[#526174] dark:text-slate-300"
          routerLink="/projects/new"
          routerLinkActive="bg-[#f0f5fa] text-[#1d527f] dark:bg-slate-800 dark:!text-blue-300"
          >Create project</a
        >
      } @else {
        <a
          class="rounded-lg px-3 py-2.25 text-[0.92rem] font-semibold text-[#526174] dark:text-slate-300"
          routerLink="/bids"
          routerLinkActive="bg-[#f0f5fa] text-[#1d527f] dark:bg-slate-800 dark:!text-blue-300"
          >My proposals</a
        >
      }
    </nav>
    <div class="flex items-center gap-3.5 max-[720px]:ml-auto">
      <span class="text-[0.9rem] text-[#526174] max-[720px]:hidden dark:text-slate-300">{{
        user.name
      }}</span>
      <button
        type="button"
        class="inline-flex min-h-10 cursor-pointer items-center justify-center gap-1.75 rounded-lg border border-transparent px-3.5 py-2.25 text-[0.9rem] font-[650] transition-colors duration-150 disabled:cursor-not-allowed disabled:opacity-60 bg-transparent text-[#526174] dark:border-slate-600 dark:text-slate-300"
        (click)="logout()"
      >
        Log out
      </button>
    </div>
  }
</header>

<main
  class="mx-auto min-h-[calc(100vh-72px)] w-[min(1180px,92vw)] pt-10.5 pb-18 max-[720px]:pt-7"
>
  <router-outlet />
</main>
