<header
  class="sticky top-0 z-50 flex min-h-14 flex-wrap items-center gap-x-6 gap-y-2 border-b border-slate-200 bg-[#111827] px-4 py-2 sm:px-6 lg:flex-nowrap lg:px-[5vw] dark:border-slate-700"
>
  <!-- Logo -->
  <a class="inline-flex shrink-0 items-center" routerLink="/projects" aria-label="DevCollab home">
    <img class="h-7 w-auto max-w-36 object-contain sm:h-8" src="/image.png" alt="DevCollab Logo" />
  </a>

  @if (authService.currentUser(); as user) {
    <!-- Navigation -->
    <nav
      class="order-3 flex min-w-0 w-full flex-1 items-center gap-1 overflow-x-auto whitespace-nowrap pb-1 sm:gap-2 lg:order-0 lg:w-auto lg:pb-0"
      aria-label="Main navigation"
    >
      <a
        class="shrink-0 rounded-lg px-3 py-2 text-sm font-medium text-slate-300 transition-colors hover:bg-slate-800 hover:text-white"
        routerLink="/projects"
        routerLinkActive="bg-slate-800 !text-white"
      >
        Projects
      </a>

      @if (user.role === 'client') {
        <a
          class="shrink-0 rounded-lg px-3 py-2 text-sm font-medium text-slate-300 transition-colors hover:bg-slate-800 hover:text-white"
          routerLink="/projects/new"
          routerLinkActive="bg-slate-800 !text-white"
        >
          Create project
        </a>
      } @else {
        <a
          class="shrink-0 rounded-lg px-3 py-2 text-sm font-medium text-slate-300 transition-colors hover:bg-slate-800 hover:text-white"
          routerLink="/bids"
          routerLinkActive="bg-slate-800 !text-white"
        >
          My proposals
        </a>
      }
    </nav>

    <!-- User actions -->
    <div class="ml-auto flex shrink-0 items-center gap-2 sm:gap-3">
      <span class="hidden max-w-36 truncate text-sm text-slate-300 md:block" [title]="user.name">
        {{ user.name }}
      </span>

      <button
        type="button"
        class="inline-flex min-h-9 items-center justify-center rounded-lg border border-slate-600 px-3 py-2 text-sm font-semibold text-slate-200 transition-colors hover:border-slate-500 hover:bg-slate-800 hover:text-white focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-400 disabled:cursor-not-allowed disabled:opacity-60"
        (click)="logout()"
      >
        Log out
      </button>
    </div>
  }
</header>

<main class="mx-auto min-h-[calc(100vh-56px)] w-[92%] max-w-295 py-7 sm:py-8 lg:py-10">
  <router-outlet />
</main>
